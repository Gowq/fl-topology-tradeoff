services:
  # GPU cluster image. Requires the NVIDIA Container Toolkit for CUDA runs.
  #   docker compose build repro-gpu
  #   docker compose run --rm repro-gpu exp07 --smoke-only --config-index 0 --device cuda
  #   docker compose run --rm repro-gpu exp07 --config-start 0 --config-count 6 --device cuda
  repro-gpu:
    build:
      context: .
      args:
        BASE_IMAGE: pytorch/pytorch:2.11.0-cuda13.0-cudnn9-runtime
    image: fl-topology-tradeoff:cluster-cu130
    volumes:
      - ./data:/workspace/data
      - ./figures:/workspace/figures
      - ./experiments:/workspace/experiments
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
